name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build container image
        run: docker build --tag blog-to-podcast:ci .

  terraform-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Initialize Terraform providers without remote state
        run: terraform init -backend=false -input=false

      - name: Validate secured production plan assertions
        run: terraform test

  terraform-plan:
    if: >-
      github.event_name == 'pull_request' &&
      vars.AZURE_CLIENT_ID != '' &&
      vars.AZURE_TENANT_ID != '' &&
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.TF_STATE_RESOURCE_GROUP != '' &&
      vars.TF_STATE_STORAGE_ACCOUNT != '' &&
      vars.TF_STATE_CONTAINER != '' &&
      vars.TF_STATE_KEY != ''
    needs: [test, build, terraform-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_tf_state_resource_group_name: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_VAR_tf_state_storage_account_name: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_VAR_owner_object_id: ${{ vars.OWNER_OBJECT_ID || '00000000-0000-0000-0000-000000000000' }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform state
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="use_azuread_auth=true"

      - name: Validate Terraform
        run: terraform validate

      - name: Create read-only Terraform plan
        run: terraform plan -input=false -lock=false -out=tfplan
