[project]
name = "blog-to-podcast"
version = "0.1.0"
description = "Streamlit app that turns any blog post into a podcast episode."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.2.10",
    "elevenlabs>=1.0.0",
    "fastapi>=0.141.1",
    "firecrawl-py>=4.6.0",
    "openai>=1.102.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.13.0",
    "streamlit>=1.40.2",
    "uvicorn>=0.52.3",
]

[project.scripts]
blog-to-podcast = "blog_to_podcast.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog_to_podcast"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
